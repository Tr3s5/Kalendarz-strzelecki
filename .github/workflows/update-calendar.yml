name: Update Proelia Calendar

on:
  workflow_dispatch:

  push:
    paths:
      - "custom_events.json"
      - "scraper.py"

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate ICS
        run: |
          python scraper.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add proelia.ics

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update calendar"

          git fetch origin main
          git reset --hard origin/main

          python scraper.py

          git add proelia.ics

          if git diff --cached --quiet; then
            echo "No changes after rebuild"
            exit 0
          fi

          git commit -m "Rebuild calendar"
          git push
